services:
  - type: web
    name: validador-choferes-chile
    env: python
    region: ohio
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: validador-db
          property: connectionString

databases:
  - name: validador-db
    plan: free
    region: ohio